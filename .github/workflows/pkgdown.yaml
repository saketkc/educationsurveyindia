on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-deploy
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MOSPI_KEY: ${{ secrets.MOSPI_KEY }}
      # nginx maps <name>.saketlab.org to /var/www/r-pkgdown/<name>, lowercase
      SITE_DIR: /var/www/r-pkgdown/esi
      DATA_DIR: vignettes/articles/data

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # mospiR (Suggests) and its dependency nesstarR are on r-universe, not CRAN
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: https://saketlab.r-universe.dev
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # The expenditure article downloads the CMS-E STATA zip and codebook (8.5 MB) when they are missing
      - uses: actions/cache@v4
        with:
          path: ${{ env.DATA_DIR }}/raw
          key: cmse-DDI-IND-MOSPI-NSS-CMSE80-2025

      # pkgdown renders every top-level .md as a public page; agent notes are internal
      - name: Build pkgdown site
        run: |
          rm -f CLAUDE.md AGENTS.md
          Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'

      # fail instead of deploying an article that ran without data
      - name: Check the article ran on real data
        run: test -f "$DATA_DIR/person.parquet"

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            rm -rf ${{ env.SITE_DIR }}/docs.new
            mkdir -p ${{ env.SITE_DIR }}/docs.new

      - name: Upload site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "docs/*"
          target: "${{ env.SITE_DIR }}/docs.new/"
          strip_components: 1
          overwrite: true

      - name: Swap live site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            cd ${{ env.SITE_DIR }}
            rm -rf docs.old
            mv docs docs.old 2>/dev/null || true
            mv docs.new docs
            rm -rf docs.old
            echo "Deployed to https://esi.saketlab.org"
